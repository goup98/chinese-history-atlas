name: Deploy to Cloudflare Workers

on:
  workflow_dispatch:
  push:
    branches: [deploy/cloudflare-worker]

concurrency:
  group: cf-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 用 npm install 而不是 npm ci：本分支改了 next 版本，锁文件未同步。
      - name: Install
        run: npm install --no-audit --no-fund
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Build (OpenNext)
        run: npx opennextjs-cloudflare build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_HISTORY_FIELD_MODE: disabled

      - name: Strip sourcemaps
        run: find .open-next -name '*.map' -delete -print | wc -l

      - name: Deploy
        run: npx wrangler deploy --minify
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
